[project]
name = "market-microstructure-lab"
version = "2.1.0"
description = "Professional Quantitative Research Software & Market Microstructure Laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "requests>=2.32.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "production_data: Tests that require local production datasets (raw ZIPs or full normalized Parquets)"
]

