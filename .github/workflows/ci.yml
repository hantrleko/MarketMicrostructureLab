name: MML CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb fastapi "uvicorn[standard]" httpx numpy polars pyarrow pydantic pytest pytest-asyncio requests scipy statsmodels websockets
      - name: Run Test Suite
        run: |
          pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
